name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify submission toolchain
        run: python3 scripts/ci_environment.py verify
      - name: Select an available iOS 26+ iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 scripts/ci_environment.py simulator --devices "$RUNNER_TEMP/devices.json" --github-env "$GITHUB_ENV"
      - name: Build unsigned Release for iOS devices
        run: |
          set -o pipefail
          xcodebuild build -project HeartSync.xcodeproj -scheme HeartSync -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath .release-deriveddata \
            CODE_SIGNING_ALLOWED=NO | tee ReleaseBuild.log
      - name: Build and run XCTest
        run: >-
          xcodebuild test -project HeartSync.xcodeproj -scheme HeartSync
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath .deriveddata -resultBundlePath TestResults.xcresult
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path SimulatorScreenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            SimulatorScreenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-screenshots
          path: SimulatorScreenshots/**/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-release-build-log
          path: ReleaseBuild.log
          if-no-files-found: ignore
